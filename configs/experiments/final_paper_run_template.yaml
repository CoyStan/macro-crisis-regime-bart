run_name: final_paper_template
data_config: configs/data/default_data.yaml
feature_registry: configs/data/feature_registry.yaml
target:
  column: crisis_any
  mode: forecast
  forecast_horizon: 12
split:
  train_end_year: 2016
  val_years: 3
models: [logistic, probit, elastic_net_logit, random_forest, xgboost, monotone_xgboost, static_pmBART, rs1, rs2, tvtp_amp]
model_configs:
  logistic: configs/models/logistic.yaml
  probit: configs/models/probit.yaml
  elastic_net_logit: configs/models/elastic_net_logit.yaml
  random_forest: configs/models/random_forest.yaml
  xgboost: configs/models/xgboost.yaml
  monotone_xgboost: configs/models/monotone_xgboost.yaml
  static_pmBART: configs/models/static_pmBART.yaml
  rs1: configs/models/rs1.yaml
  rs2: configs/models/rs2.yaml
  tvtp_amp: configs/models/tvtp_amp.yaml
